name: TerraBrief Morning Briefing

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths-ignore:
      - "data/**"
      - "briefing.md"
      - "site/briefing.md"
      - "site/data/**"
      - "site/archive.json"
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: terrabrief-test
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download TerraBrief
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Test OpenRouter AI connection
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/test_ai.py

      - name: Test full AI pipeline with 5 articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/test_ai_full.py

      - name: Run TerraBrief
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/main.py
        timeout-minutes: 5

      - name: Prepare website
        run: |
          rm -rf site/data
          mkdir -p site/data
          cp briefing.md site/briefing.md
          cp data/*.md site/data/

          python - <<'PY'
          import json
          from pathlib import Path

          reports = []
          for path in sorted(Path("data").glob("*.md"), reverse=True):
              reports.append({
                  "date": path.stem,
                  "file": path.name
              })

          Path("site/archive.json").write_text(
              json.dumps(reports, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Save briefing and website data
        run: |
          git config user.name "TerraBrief"
          git config user.email "terrabrief@users.noreply.github.com"
          git add data/
          git add -f briefing.md
          git add site/
          git diff --cached --quiet || git commit -m "Add daily TerraBrief briefing"

          # The test branch may have received a website/code fix while this
          # briefing was being generated. Rebase the generated files onto the
          # newest remote commit before pushing.
          git fetch origin test
          git rebase origin/test
          git push origin HEAD:test

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
